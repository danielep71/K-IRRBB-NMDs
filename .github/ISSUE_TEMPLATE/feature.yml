name: "Feature or model improvement"
description: "Define an auditable capability and testable acceptance criteria."
title: "[Feature]: "
labels: ["enhancement", "P2"]
assignees: ["danielep71"]
body:
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "Rates / ECM"
        - "Stable / logit"
        - "Decay"
        - "Backtesting"
        - "Workbook / downstream ALM platform export"
        - "Repository and CI"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem / user need"
    validations:
      required: true
  - type: textarea
    id: methodology
    attributes:
      label: "Methodological basis"
      description: "The method, regulatory or econometric source and assumptions the change rests on, with references to docs/methodology/ where they exist; \"Not applicable.\" for a repository or CI change."
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: "Proposed observable behavior (units, bounds, source)"
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: "Compatibility"
      description: "Effect on the public API, workbook contract, data contract, model versions and stored results, and any migration you need; or \"None.\""
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Optional. Other ways to meet the need, including doing nothing, and why you prefer the proposed behavior."
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checklist"
      placeholder: "- [ ] Independent numerical result
- [ ] Regression test
- [ ] Failure behavior"
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: "Validation"
      description: "How the change will be shown correct: independent expected values and tolerances, regression tests, and the Excel evidence needed."
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: "Non-goals"
    validations:
      required: true
  - type: input
    id: start_date
    attributes:
      label: "Start date (Europe/Rome)"
      description: "Propose the date work starts (YYYY-MM-DD, Europe/Rome), on or before the target end date. I may change it during triage."
      placeholder: "2026-12-01"
    validations:
      required: true
  - type: input
    id: target_end_date
    attributes:
      label: "Target end date (Europe/Rome)"
      description: "Propose a date (YYYY-MM-DD, Europe/Rome) before the milestone's due date. I may change it during triage."
      placeholder: "2026-12-15"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "A line \"Blocked by #N\" for each issue that must be resolved first, or \"External condition: ...\", or \"None.\" Other related issues may be named freely."
      placeholder: "None."
    validations:
      required: true
