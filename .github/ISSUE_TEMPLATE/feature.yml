name: "Feature or model improvement"
description: "Define an auditable capability and testable acceptance criteria."
title: "[Feature]: "
labels: ["enhancement", "P2"]
assignees: ["danielep71"]
body:
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "Rates / ECM"
        - "Stable / logit"
        - "Decay"
        - "Backtesting"
        - "Workbook / downstream ALM platform export"
        - "Repository and CI"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem / user need"
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: "Proposed observable behavior (units, bounds, source)"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checklist"
      placeholder: "- [ ] Independent numerical result
- [ ] Regression test
- [ ] Failure behavior"
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: "Non-goals"
    validations:
      required: true
  - type: input
    id: target_end_date
    attributes:
      label: "Target end date (Europe/Rome)"
      description: "YYYY-MM-DD, before the milestone's due date. Leave empty if unsure; I set it during triage."
      placeholder: "2026-12-15"
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Issues that must be resolved first (#N), or \"External condition: ...\", or \"None.\""
      placeholder: "None."
    validations:
      required: true
