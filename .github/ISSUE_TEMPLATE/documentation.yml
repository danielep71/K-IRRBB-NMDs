name: "Documentation improvement"
description: "Correct or extend authoritative project documentation."
title: "[Docs]: "
labels: ["documentation", "P3"]
assignees: ["danielep71"]
body:
  - type: textarea
    id: issue
    attributes:
      label: "Affected document and discrepancy"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: "Proposed improvement and acceptance criteria"
    validations:
      required: true
  - type: input
    id: target_end_date
    attributes:
      label: "Target end date (Europe/Rome)"
      description: "YYYY-MM-DD, before the milestone's due date. Leave empty if unsure; I set it during triage."
      placeholder: "2026-12-15"
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "A line \"Blocked by #N\" for each issue that must be resolved first, or \"External condition: ...\", or \"None.\" Other related issues may be named freely."
      placeholder: "None."
    validations:
      required: true
