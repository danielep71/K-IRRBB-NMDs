name: "Bug report"
description: "Report a reproducible defect with synthetic evidence."
title: "[Bug]: "
labels: ["bug", "P2"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data only; report vulnerabilities privately."
  - type: input
    id: commit
    attributes:
      label: "Exact commit SHA"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: "Affected component"
      options:
        - "Rates / ECM"
        - "Stable / logit"
        - "Decay"
        - "Backtesting"
        - "Workbook integration"
        - "Repository tooling"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Synthetic reproduction"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected result and independent source"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: "Observed result and impact"
    validations:
      required: true
  - type: input
    id: target_end_date
    attributes:
      label: "Target end date (Europe/Rome)"
      description: "YYYY-MM-DD, before the milestone's due date. Leave empty if unsure; I set it during triage."
      placeholder: "2026-12-15"
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "A line \"Blocked by #N\" for each issue that must be resolved first, or \"External condition: ...\", or \"None.\" Other related issues may be named freely."
      placeholder: "None."
    validations:
      required: true
