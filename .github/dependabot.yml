# Version updates for the GitHub Actions pinned in .github/workflows/ and for
# the hash-locked quality tools in tools/requirements-quality-ci.txt. Every
# update arrives as a pull request for review; nothing merges automatically.
# See tools/README.md -> "Dependency updates".
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Work flows through the active release branch, never straight into main.
    # Update this value when a new release branch is opened.
    target-branch: "release/v0.2.0"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "ci"
      - "P3"
    # Issue triage requires an assignee on every item.
    assignees:
      - "danielep71"
    # CodeQL refuses to run when its init and analyze steps differ in version,
    # so every github/codeql-action step moves in one pull request.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "pip"
    directory: "/tools"
    target-branch: "release/v0.2.0"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(python)"
    labels:
      - "ci"
      - "P3"
    # Issue triage requires an assignee on every item.
    assignees:
      - "danielep71"
    # Ruff, mypy and their dependencies move together in one pull request.
    groups:
      python-quality-tools:
        patterns:
          - "*"
