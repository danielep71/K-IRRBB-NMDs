# ---------------------------------------------------------------------------
# Daily traffic export
#
#   Reads the GitHub traffic API for this repository and merges a daily
#   snapshot into CSV files on the orphan `traffic-history` branch, which the
#   first run creates, with tools/traffic_history.py. The module also writes
#   data/badges/clones.json, visitors.json and visits.json there: shields.io
#   endpoints for README badges, which shields.io can read because the
#   repository is public. A second job then opens one alert issue for the day
#   when the history shows a views spike, more stars or forks, or a new
#   referrer.
#
#   Data retention
#     GitHub retains traffic data for 14 days only. This workflow exists to
#     keep a longer history. The `traffic-history` branch is visible to anyone
#     who can read this repository, and the data it holds (view counts, clone
#     counts, referrers, popular paths) is the same aggregate data GitHub
#     already exposes to repository admins. It contains no identifying
#     information about individual visitors.
#
#   Credentials
#     The traffic API needs `Administration: read`, which the workflow token
#     cannot have. A GitHub App with only that permission, installed on this
#     repository, issues an installation token in each run; it expires after
#     an hour and is revoked when the collect job ends, so there is nothing to
#     rotate. The App's client ID is the variable TRAFFIC_APP_CLIENT_ID and its
#     private key the secret TRAFFIC_APP_PRIVATE_KEY, both in the repository's
#     `analytics` environment, whose deployment branches are limited to main.
#     That environment is not a workflow-identity boundary: any job declaring
#     it may request access, subject to the configured environment protections.
#     Only the token step receives the key and only the fetch step receives the
#     token. The workflow token pushes the history (collect job, contents:
#     write) and opens the alert issue (alert job, issues: write, no
#     environment). See docs/TRAFFIC.md.
#
#   Scope
#     This is repository analytics. It is not CI. It compiles nothing, runs no
#     tests, and must never be extended to do so. Software quality is
#     static-checks.yml, deliberately separate so that the analytics App key is
#     never available to a job that executes code under review. Every checkout
#     here sets persist-credentials: false; the push step alone authenticates,
#     with the workflow token, and the workflow runs only from the default
#     branch.
# ---------------------------------------------------------------------------

name: Daily traffic export

on:
  schedule:
    # Daily, off the hour, when GitHub delays scheduled runs least.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege: nothing at the top level; each job states its own grants.
#   collect  contents: write  pushes the CSV history to the traffic-history branch
#   alert    contents: read   checks out the module and the pushed history
#            issues:   write  opens an alert issue on a traffic spike or new referrer
permissions: {}

concurrency:
  group: daily-traffic-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    name: Collect GitHub traffic
    # Manual dispatch can select any branch. Run only the default branch's
    # reviewed copy; scheduled events already run on the default branch.
    # The analytics environment independently allows only main, preventing a
    # branch-edited workflow from bypassing this guard to access its secrets.
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    # Requests the repository-level analytics environment. Keep this declaration
    # out of every code-executing build, test and release job; the environment
    # name alone does not bind the secret to this workflow identity.
    environment: analytics

    outputs:
      history-sha: ${{ steps.push.outputs.sha }}

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout main branch
        # v7.0.1 - pinned to a full commit SHA so a moved tag cannot change what runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches, so that traffic-history is available without credentials.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"

      - name: Prepare traffic-history branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          HISTORY="$RUNNER_TEMP/traffic-history"
          echo "HISTORY=$HISTORY" >> "$GITHUB_ENV"
          if git rev-parse --verify --quiet refs/remotes/origin/traffic-history > /dev/null; then
            git worktree add -B traffic-history "$HISTORY" origin/traffic-history
          else
            git worktree add --detach "$HISTORY"
            git -C "$HISTORY" checkout --orphan traffic-history
            git -C "$HISTORY" rm -rfq .
          fi

          mkdir -p "$HISTORY/data"

      - name: Check the traffic App configuration
        env:
          CLIENT_ID: ${{ vars.TRAFFIC_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Missing TRAFFIC_APP_CLIENT_ID or TRAFFIC_APP_PRIVATE_KEY in the analytics environment"
            echo "Install a GitHub App with Administration: read on this repository; see docs/TRAFFIC.md."
            exit 1
          fi

      - name: Create the traffic App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRAFFIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY }}
          permission-administration: read

      - name: Fetch GitHub traffic API data
        id: fetch
        env:
          TRAFFIC_API_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_URL: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          set -euo pipefail

          echo "collected_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          RAW="$RUNNER_TEMP/traffic-raw"
          echo "RAW=$RAW" >> "$GITHUB_ENV"
          mkdir -p "$RAW"
          # The REST API version this export was written and verified against;
          # the other scripts request 2022-11-28 (tools/test_workflow_pins.py).
          API_VERSION="2026-03-10"

          # curl retries timeouts and HTTP 408, 429, 500, 502, 503 and 504;
          # any other failure stops the run before the history is touched.
          api_get() {
            local label="$1"
            local url="$2"
            local output="$3"
            local status

            status=$(curl -sS -L \
              --retry 5 --retry-max-time 300 --max-time 60 \
              -o "$output" \
              -w "%{http_code}" \
              -H "Authorization: Bearer $TRAFFIC_API_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "$url")

            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$label failed with HTTP $status"
              echo "Response body:"
              head -c 2000 "$output" || true
              echo
              exit 1
            fi
          }

          api_get "Page views" "$BASE_URL/traffic/views?per=day" "$RAW/views.json"
          api_get "Clones" "$BASE_URL/traffic/clones?per=day" "$RAW/clones.json"
          api_get "Top referrers" "$BASE_URL/traffic/popular/referrers" "$RAW/referrers.json"
          api_get "Popular paths" "$BASE_URL/traffic/popular/paths" "$RAW/paths.json"
          api_get "Repository metadata" "$BASE_URL" "$RAW/repository.json"

      - name: Build CSV history
        env:
          COLLECTED_AT: ${{ steps.fetch.outputs.collected_at }}
        run: >-
          python tools/traffic_history.py merge
          --raw "$RAW" --data "$HISTORY/data"
          --collected-at "$COLLECTED_AT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit and push traffic history
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTED_AT: ${{ steps.fetch.outputs.collected_at }}
        run: |
          set -euo pipefail
          cd "$HISTORY"

          # The checkout kept no credentials: the workflow token authenticates
          # the fetches and pushes below, through a header that is never
          # written to disk.
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          auth=(-c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $basic")

          commit_history() {
            git add data/
            if git diff --cached --quiet; then
              echo "No traffic changes to commit"
            else
              git commit -q -m "Update traffic history"
            fi
          }

          # If traffic-history moved since the checkout, the push is rejected:
          # rebuild on the latest history from the same collection and retry.
          commit_history
          for attempt in 1 2 3; do
            if git "${auth[@]}" push origin HEAD:traffic-history; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" -lt 3 ] || break
            echo "::warning::Push attempt $attempt was rejected; rebuilding on the latest traffic-history"
            git "${auth[@]}" fetch origin traffic-history
            git reset -q --hard FETCH_HEAD
            python "$GITHUB_WORKSPACE/tools/traffic_history.py" merge \
              --raw "$RAW" --data "$HISTORY/data" --collected-at "$COLLECTED_AT"
            commit_history
          done
          echo "::error::traffic-history push was rejected 3 times; the collection is not saved"
          exit 1

  alert:
    name: Traffic alert
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No environment: this job never receives the App's key or token.
    permissions:
      contents: read
      issues: write

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # An empty ref would make the checkout below fall back to the default
      # branch, and the alert would then read the wrong tree.
      - name: Check the pushed history commit
        env:
          HISTORY_SHA: ${{ needs.collect.outputs.history-sha }}
        run: |
          if ! [[ "$HISTORY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The collect job reported no valid traffic-history commit: '$HISTORY_SHA'"
            exit 1
          fi

      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the pushed traffic history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.collect.outputs.history-sha }}
          path: history
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"

      - name: Create alert issue on spike or new referrer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The module files the alert under the open milestone with the
          # earliest due date after today (UTC), and fails the run when there
          # is none, whether or not an alert is due.
          milestones="$RUNNER_TEMP/milestones.json"
          gh api "repos/$GH_REPO/milestones?state=open&sort=due_on&direction=asc&per_page=100" \
            > "$milestones"

          alert="$RUNNER_TEMP/alert.json"
          python tools/traffic_history.py alert \
            --data history/data --milestones "$milestones" --output "$alert"
          [ -f "$alert" ] || exit 0

          title="$(jq -r .title "$alert")"
          milestone="$(jq -r .milestone "$alert")"
          jq -j .body "$alert" > "$RUNNER_TEMP/alert.md"

          if ! existing="$(gh issue list --state all --search "\"$title\" in:title" \
                --limit 10 --json number --jq length)"; then
            echo "::error::Could not determine whether an alert issue already exists"
            exit 1
          fi
          if [ "$existing" != "0" ]; then
            echo "Alert issue already exists: $title"
            exit 0
          fi

          if ! gh issue create --title "$title" --assignee danielep71 --label P3 \
                --milestone "$milestone" --body-file "$RUNNER_TEMP/alert.md"; then
            echo "::error::Traffic alert triggered but the issue could not be created"
            exit 1
          fi
