name: Static repository checks

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Verify exact checkout and run portable gates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          args=(--ci)
          if [[ -n "$PR_BASE_SHA" ]]; then
            args+=(--base "$PR_BASE_SHA")
          fi
          python tools/check.py "${args[@]}"
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-checks-${{ github.sha }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
