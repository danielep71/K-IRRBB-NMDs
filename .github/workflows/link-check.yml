name: External link check

# The offline link check runs in the Static repository checks on every push and
# pull request. This weekly run also requests each external https link, so a
# page that moves or disappears is found without blocking unrelated changes.
on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    name: External links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - name: Check Markdown links, including external ones
        run: python tools/check_links.py --external
