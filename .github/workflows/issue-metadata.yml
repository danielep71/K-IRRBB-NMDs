name: Enforce issue metadata

on:
  issues:
    types: [opened, edited, reopened, closed, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/issue-metadata.py
      - .github/workflows/issue-metadata.yml

permissions:
  contents: read

concurrency:
  group: issue-metadata-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'issues' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile and verify open and closed issues
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          ISSUE_IS_PULL_REQUEST: ${{ github.event.issue.pull_request && 'true' || '' }}
          ISSUE_MILESTONE_NUMBER: ${{ vars.ISSUE_MILESTONE_NUMBER || '1' }}
        run: python3 .github/scripts/issue-metadata.py
