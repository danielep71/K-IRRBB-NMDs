# Quality settings for the repository's Python tooling (tools/).
# The tooling itself needs only the standard library, except the optional
# tools/devbuild/lo_smoke.py, which needs LibreOffice's python3-uno. CI installs
# Ruff and mypy from the hash-locked tools/requirements-quality-ci.txt and
# enforces both.

[tool.ruff]
target-version = "py311"
# Formatting target only: E501 is not selected and CI does not run ruff format.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.11"
files = ["tools"]
pretty = true
show_error_codes = true
warn_unused_configs = true
# Every module, tests included, is held to the full strict bundle.
strict = true
